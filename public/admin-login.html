<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Admin Access | Push Button Cash</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#17335e,#07111f 62%);font-family:Inter,Arial,sans-serif;color:#e8eef8}.card{width:min(420px,calc(100% - 32px));padding:40px;border:1px solid #28405f;border-radius:20px;background:#0d1a2c;box-shadow:0 24px 70px #0008;text-align:center}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 20px;border-radius:15px;background:#5865f2;font-weight:900;font-size:23px}h1{margin:0 0 8px;font-size:28px}p{margin:0 0 25px;color:#91a2ba}input{width:100%;height:62px;border:1px solid #344b69;border-radius:12px;background:#07111f;color:#fff;text-align:center;font-size:28px;font-weight:800;letter-spacing:.25em;outline:none}input:focus{border-color:#6b7cff;box-shadow:0 0 0 4px #5865f233}button{width:100%;height:54px;margin-top:16px;border:0;border-radius:12px;background:#5865f2;color:#fff;font-size:17px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.error{min-height:22px;margin-top:14px;color:#ff6b7a;font-weight:700}</style></head><body><main class="card"><div class="mark">PB</div><h1>Campaign Command</h1><p>Enter the admin PIN to continue.</p><form id="pin-form"><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="one-time-code" autofocus required aria-label="Admin PIN"><button id="submit">Open Dashboard</button><div class="error" id="error" role="alert"></div></form></main><script src="/assets/admin-login.js"></script></body></html>
